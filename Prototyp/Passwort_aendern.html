<!DOCTYPE html>
<html lang="de">
<head>
    <title>Neues Passwort festlegen | Lehrer-Wunschliste</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function speichern(event) {
            event.preventDefault();

            const neu = document.getElementById("neues_passwort").value;
            const wiederholt = document.getElementById("passwort_wiederholen").value;
            const fehler = document.getElementById("fehler");

            if (neu !== wiederholt) {
                fehler.textContent = "Die Passwörter stimmen nicht überein.";
                return;
            }

            fehler.textContent = "";
            // Danach: Weiterleitung je nach Rolle (hier als Beispiel die Admin-Ansicht)
            window.location.href = "Anmeldung.html";
        }
    </script>
    <style>

@import url("farben.css");

/* ==========================================
   LWL – NEUES PASSWORT FESTLEGEN
   Einheitliches LWL-Design
   ========================================== */

/* GRUNDEINSTELLUNGEN */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Arial, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 100vh;
    margin: 0;
    padding: 28px 18px;

    background: var(--farbe-hintergrund);
    color: var(--farbe-text);

    font-size: 14px;
    line-height: 1.5;
}

/* ==========================================
   PASSWORT-KARTE
   ========================================== */

.login_karte {
    position: relative;

    width: 100%;
    max-width: 520px;

    padding: 44px 48px 36px;

    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 15px;

    box-shadow:
        0 7px 24px var(--farbe-schatten);

    overflow: hidden;
}

/* GELBER AKZENT LINKS */

.login_karte::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 5px;

    background: var(--farbe-primaer);
}

/* ==========================================
   ÜBERSCHRIFT
   ========================================== */

h1 {
    margin: 0 0 34px;

    text-align: center;

    font-size: 24px;
    font-weight: 750;
    letter-spacing: -0.6px;
    line-height: 1.3;

    color: var(--farbe-text);
}

/* ==========================================
   FORMULAR
   ========================================== */

form {
    display: flex;
    flex-direction: column;

    width: 100%;
}

/* BESCHRIFTUNGEN */

label {
    display: block;

    margin-bottom: 9px;

    font-size: 13px;
    font-weight: 650;

    color: var(--farbe-text);
}

/* PASSWORT-EINGABEFELDER */

input[type="password"] {
    width: 100%;
    min-height: 46px;

    padding: 12px 15px;
    margin-bottom: 24px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 500;

    color: var(--farbe-text);
    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background-color 0.2s ease;
}

/* HOVER */

input[type="password"]:hover {
    border-color: var(--farbe-primaer);
}

/* FOKUS */

input[type="password"]:focus {
    border-color: var(--farbe-primaer);

    box-shadow:
        0 0 0 3px var(--farbe-primaer-hell);
}

/* ==========================================
   FEHLERMELDUNG
   ========================================== */

#fehler {
    margin: 0;

    color: #b3261e;

    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
}

/* NUR ANZEIGEN, WENN FEHLER VORHANDEN */

#fehler:not(:empty) {
    margin: -6px 0 20px;
    padding: 12px 15px;

    background: #fff1f0;

    border: 1px solid #f1c6c3;
    border-radius: 9px;
}

/* ==========================================
   BUTTONS
   ========================================== */

button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    min-height: 45px;

    padding: 12px 22px;

    font-family: inherit;
    font-size: 13px;
    font-weight: 700;

    color: var(--farbe-text);
    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

button:active {
    transform: translateY(1px);
}

button:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 3px;
}

/* ==========================================
   SPEICHERN-BUTTON
   ========================================== */

button[type="submit"] {
    margin-top: 10px;

    background: var(--farbe-primaer);
    border-color: var(--farbe-primaer);
    color: var(--farbe-text);
}

button[type="submit"]:hover {
    background: var(--farbe-primaer-hover);
    border-color: var(--farbe-primaer-hover);
}

/* ==========================================
   RETURN-BUTTON
   ========================================== */

.login_karte > button {
    margin-top: 12px;

    background: var(--farbe-oberflaeche);
    border: 1px solid var(--farbe-rahmen);

    color: var(--farbe-text);
}

.login_karte > button:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);
}

/* ==========================================
   HINWEISTEXT
   ========================================== */

.hinweis {
    margin: 27px 0 0;

    text-align: center;

    font-size: 12px;
    line-height: 1.6;

    color: var(--farbe-text-sekundaer);
}

/* ==========================================
   SMARTPHONE
   ========================================== */

@media (max-width: 600px) {

    body {
        padding: 20px 14px;
    }

    .login_karte {
        padding: 34px 24px 28px;
        border-radius: 12px;
    }

    h1 {
        font-size: 21px;
        margin-bottom: 28px;
    }

    input[type="password"] {
        min-height: 44px;
        padding: 11px 13px;
        margin-bottom: 20px;
    }

    button {
        min-height: 44px;
    }

    .hinweis {
        margin-top: 23px;
    }
}

/* ==========================================
   REDUZIERTE ANIMATIONEN
   ========================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

    </style>
</head>
<body>
<main class="login_karte">
    <h1>Neues Passwort festlegen</h1>

    <form onsubmit="speichern(event)">
        <label for="neues_passwort">Neues Passwort</label>
        <input type="password" id="neues_passwort" name="neues_passwort" autocomplete="new-password" required>

        <label for="passwort_wiederholen">Neues Passwort wiederholen</label>
        <input type="password" id="passwort_wiederholen" name="passwort_wiederholen" autocomplete="new-password" required>

        <p id="fehler" role="alert"></p>

        <button type="submit">Speichern</button>
    </form>

    <button onclick="window.location.href='Anmeldung.html'">Zurück</button>

    <p class="hinweis">Danach: Weiterleitung je nach Rolle</p>
</main>
</body>
</html>
