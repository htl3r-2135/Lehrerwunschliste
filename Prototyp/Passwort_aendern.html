<!DOCTYPE html>
<html lang="de">
<head>
    <title>Neues Passwort festlegen | Lehrer-Wunschliste</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function speichern(event) {
            event.preventDefault();

            const neu = document.getElementById("neues_passwort").value;
            const wiederholt = document.getElementById("passwort_wiederholen").value;
            const fehler = document.getElementById("fehler");

            if (neu !== wiederholt) {
                fehler.textContent = "Die Passwörter stimmen nicht überein.";
                return;
            }

            fehler.textContent = "";
            // Danach: Weiterleitung je nach Rolle (hier als Beispiel die Admin-Ansicht)
            window.location.href = "Anmeldung.html";
        }
    </script>
    <style>
@import url("farben.css");

/* GRUNDEINSTELLUNGEN */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;

    color: var(--farbe-text);
    background: var(--farbe-hintergrund);
}

/* KARTE */

.login_karte {
    position: relative;

    width: 100%;
    max-width: 520px;
    padding: 44px 48px 36px;

    background: var(--farbe-oberflaeche);
    border: 1px solid var(--farbe-rahmen);
    border-radius: 14px;
    box-shadow: 0 5px 20px var(--farbe-schatten);

    overflow: hidden;
}

/* GELBER AKZENT LINKS */

.login_karte::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: var(--farbe-primaer);
}

h1 {
    margin: 0 0 40px;
    text-align: center;

    font-size: 23px;
    font-weight: 750;
    letter-spacing: -0.6px;
    line-height: 1.35;
}

/* FORMULAR */

label {
    display: block;
    margin: 0 0 6px;

    font-size: 13px;
    color: var(--farbe-text-sanft, #6b6b6b);
}

input {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 20px;

    font-family: inherit;
    font-size: 15px;
    color: var(--farbe-text);

    background: var(--farbe-oberflaeche);
    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;
}

input:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 1px;
    border-color: var(--farbe-primaer);
}

#fehler {
    min-height: 20px;
    margin: -8px 0 12px;
    font-size: 13px;
    color: #b3261e;
}

/* BUTTON */

button {
    display: block;
    width: 100%;
    max-width: 260px;
    margin: 12px auto 0;
    padding: 12px 22px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 650;

    color: var(--farbe-text);
    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

button:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);
}

button:active {
    transform: translateY(1px);
}

button:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 3px;
}

.hinweis {
    margin: 30px 0 0;
    font-size: 13px;
    color: var(--farbe-text-sanft, #6b6b6b);
}

/* SMARTPHONE */

@media (max-width: 600px) {
    .login_karte {
        padding: 34px 24px 28px;
    }

    h1 {
        font-size: 20px;
        margin-bottom: 28px;
    }
}

/* REDUZIERTE ANIMATIONEN */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}
    </style>
</head>
<body>
<main class="login_karte">
    <h1>Neues Passwort festlegen</h1>

    <form onsubmit="speichern(event)">
        <label for="neues_passwort">Neues Passwort</label>
        <input type="password" id="neues_passwort" name="neues_passwort" autocomplete="new-password" required>

        <label for="passwort_wiederholen">Neues Passwort wiederholen</label>
        <input type="password" id="passwort_wiederholen" name="passwort_wiederholen" autocomplete="new-password" required>

        <p id="fehler" role="alert"></p>

        <button type="submit">Speichern</button>
    </form>

    <button onclick="window.location.href='Anmeldung.html'">Return</button>

    <p class="hinweis">Danach: Weiterleitung je nach Rolle</p>
</main>
</body>
</html>
