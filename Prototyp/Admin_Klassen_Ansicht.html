<!DOCTYPE html>
<html lang="de">
<head>
    <title>Klasse erstellen</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
/* ------------------------------------------
           Gemeinsame Prototyp-Logik (in allen Admin-
           Stammdaten-Seiten gleich).
           Die Daten liegen im localStorage des Browsers.
           ------------------------------------------ */

        const SPEICHER_KEY = "lwl.stammdaten.v1";

        const STANDARD_DATEN = {
            abteilungen: ["WEBT", "Informationstechnologie", "Mechatronik"],
            klassen: [
                { name: "4CN", abteilung: "Informationstechnologie", stufe: 4, schueler: 22 },
                { name: "5CN", abteilung: "Informationstechnologie", stufe: 5, schueler: 21 },
                { name: "5AX", abteilung: "WEBT", stufe: 5, schueler: 23 }
            ],
            faecher: [],
            lehrer: []
        };

        let zwischenspeicher = null;

        function laden() {
            let daten = null;
            try {
                daten = JSON.parse(localStorage.getItem(SPEICHER_KEY));
            } catch (e) {}
            if (!daten) daten = zwischenspeicher;
            if (!daten) daten = JSON.parse(JSON.stringify(STANDARD_DATEN));
            for (const liste of ["abteilungen", "klassen", "faecher", "lehrer"]) {
                if (!Array.isArray(daten[liste])) daten[liste] = [];
            }
            return daten;
        }

        function speichern(daten) {
            zwischenspeicher = daten;
            try {
                localStorage.setItem(SPEICHER_KEY, JSON.stringify(daten));
            } catch (e) {}
        }

        /* Wurde die Seite über Admin_Uebersicht.html geöffnet (?start=neu),
           führt "Zurück" wieder dorthin – sonst zu Admin_Ansicht.html. */

        const VON_NEUER_UEBERSICHT =
            new URLSearchParams(window.location.search).get("start") === "neu";

        const STARTSEITE = VON_NEUER_UEBERSICHT
            ? "Admin_Uebersicht.html"
            : "Admin_Ansicht.html";

        function logout() {
            window.location.href = "Anmeldung.html";
        }

        /* Geführte Stammdatenerstellung (?gefuehrt=1): nur dann werden
           "Schritt X von 4" und die Zurück/Weiter-Leiste angezeigt. */
        const GEFUEHRT =
            new URLSearchParams(window.location.search).get("gefuehrt") === "1";

        function redirect(file) {
            const parameter = [];
            if (VON_NEUER_UEBERSICHT) parameter.push("start=neu");
            if (GEFUEHRT) parameter.push("gefuehrt=1");
            window.location.href = file + (parameter.length ? "?" + parameter.join("&") : "");
        }

        function zurUebersicht(from) {
            window.location.href = STARTSEITE + (from ? "?from=" + encodeURIComponent(from) : "");
        }

        function el(id) {
            return document.getElementById(id);
        }

        function esc(text) {
            return String(text).replace(/[&<>"']/g, zeichen => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[zeichen]));
        }

        function gleich(a, b) {
            return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
        }

        function meldung(text, fehler) {
            const box = el("meldung");
            box.textContent = text;
            box.className = "sichtbar" + (fehler ? " fehler" : "");
        }

        function loeschButton(index, name) {
            return '<td class="loeschen"><button type="button" data-index="' + index +
                '" aria-label="' + esc(name) + ' löschen">✕</button></td>';
        }

        function leereZeile(spalten, text) {
            return '<tr><td class="leer" colspan="' + spalten + '">' + text + '</td></tr>';
        }
    </script>
    <style>

@import url("farben.css");

/* ==========================================
   LWL – ADMIN STAMMDATEN
   Einheitliches Admin-Design
   ========================================== */

/* GRUNDEINSTELLUNGEN */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;

    background: var(--farbe-hintergrund);
    color: var(--farbe-text);

    font-size: 14px;
    line-height: 1.5;
}

/* TOPBAR */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;

    width: 100%;
    min-height: 88px;
    padding: 20px max(28px, calc((100vw - 1100px) / 2));

    background: var(--farbe-oberflaeche);
    border-bottom: 1px solid var(--farbe-rahmen);
}

header h2 {
    margin: 0;

    font-size: 21px;
    font-weight: 750;
    letter-spacing: -0.5px;
    line-height: 1.3;
}

/* BUTTONS */

button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 43px;
    padding: 11px 22px;

    font-family: inherit;
    font-size: 13px;
    font-weight: 700;

    background: var(--farbe-oberflaeche);
    color: var(--farbe-text);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

button:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);
}

button:active {
    transform: translateY(1px);
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 3px;
}

/* PRIMÄRAKTION (GELB) */

button.primaer {
    min-width: 135px;

    background: var(--farbe-primaer);
    border-color: var(--farbe-primaer);

    font-weight: 750;

    box-shadow: 0 4px 12px var(--farbe-schatten);
}

button.primaer:hover {
    background: var(--farbe-primaer-hover);
    border-color: var(--farbe-primaer-hover);
}

/* HAUPTBEREICH */

main {
    display: flex;
    flex-direction: column;
    align-items: stretch;

    width: 100%;
    max-width: 1100px;

    margin: 0 auto;
    padding: 55px 28px 90px;
}

main > button:first-child {
    align-self: flex-start;
    margin-bottom: 30px;
}

/* KARTEN */

.karte {
    width: 100%;
    margin-bottom: 24px;

    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 15px;

    box-shadow: 0 7px 24px var(--farbe-schatten);

    overflow: hidden;
}

.karte h3 {
    position: relative;

    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 15px;

    margin: 0;
    padding: 27px 32px;

    font-size: 21px;
    font-weight: 750;
    letter-spacing: -0.5px;
    line-height: 1.3;

    border-bottom: 1px solid var(--farbe-rahmen);
}

/* GELBER AKZENT AN DER ÜBERSCHRIFT */

.karte h3::before {
    content: "";

    position: absolute;
    left: 0;
    top: 26px;
    bottom: 26px;

    width: 4px;

    background: var(--farbe-primaer);
    border-radius: 0 3px 3px 0;
}

.karte h3 span {
    font-size: 13px;
    font-weight: 650;
    letter-spacing: 0;
    color: var(--farbe-text-sekundaer);
}

.inhalt {
    padding: 28px 32px 30px;
}

/* FORMULARFELDER */

.zeile {
    display: flex;
    align-items: flex-end;
    gap: 22px;

    margin-bottom: 24px;
}

.feld {
    flex: 1;
    min-width: 0;
}

.feld.schmal {
    flex: 0 0 190px;
}

.feld.fest {
    flex: 0 0 auto;
}

label,
.beschriftung {
    display: block;

    margin-bottom: 9px;

    font-size: 13px;
    font-weight: 650;
}

input[type="text"],
input[type="email"],
input[type="number"],
select {
    width: 100%;
    min-height: 45px;
    padding: 11px 15px;

    background: var(--farbe-oberflaeche);
    color: var(--farbe-text);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 550;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

select {
    cursor: pointer;
}

input::placeholder {
    color: var(--farbe-text-sekundaer);
    opacity: 0.8;
}

input:hover,
select:hover {
    border-color: var(--farbe-primaer);
}

input:focus,
select:focus {
    border-color: var(--farbe-primaer);
    box-shadow: 0 0 0 3px var(--farbe-primaer-hell);
}

/* AUSWAHL-TAGS (ABTEILUNGEN, SCHULSTUFEN) */

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;

    margin-bottom: 24px;
}

.tags label {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    min-height: 44px;
    margin: 0;
    padding: 11px 16px;

    background: var(--farbe-oberflaeche-sanft);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}

.tags label:hover,
.tags label:has(input:checked) {
    background: var(--farbe-primaer-hell);
    border-color: var(--farbe-primaer);
}

.tags label:has(input:checked) {
    color: var(--farbe-primaer-dunkel);
}

.tags input {
    width: 17px;
    height: 17px;
    margin: 0;

    accent-color: var(--farbe-primaer-dunkel);
    cursor: pointer;
}

/* HINWEISE UND MELDUNGEN */

.hinweis {
    margin: 0;

    font-size: 13px;
    color: var(--farbe-text-sekundaer);
}

.hinweis a {
    color: var(--farbe-primaer-dunkel);
    font-weight: 650;
}

#meldung {
    display: none;

    margin-bottom: 24px;
    padding: 13px 18px;

    border-radius: 9px;

    font-size: 14px;
    font-weight: 650;

    background: var(--farbe-status-normal-hintergrund);
    color: var(--farbe-status-normal-text);
}

#meldung.sichtbar {
    display: block;
}

#meldung.fehler {
    background: var(--farbe-status-voll-hintergrund);
    color: var(--farbe-status-voll-text);
}

/* BUTTON-LEISTEN */

.leiste {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
}

.leiste.verteilt {
    justify-content: space-between;
}

/* TABELLEN */

.tabelle {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
}

th,
td {
    padding: 16px 18px;

    font-size: 15px;
    border-bottom: 1px solid var(--farbe-rahmen);
}

th {
    font-size: 13px;
    font-weight: 700;

    background: var(--farbe-oberflaeche-sanft);
    border-bottom: 2px solid var(--farbe-primaer);
}

tbody tr {
    transition: background-color 0.2s ease;
}

tbody tr:last-child td {
    border-bottom: none;
}

tbody tr:hover {
    background: var(--farbe-oberflaeche-sanft);
}

td.leer {
    padding: 26px 18px;

    opacity: 0.7;
}

th:last-child,
td.loeschen {
    width: 80px;
    text-align: center;
}

td.loeschen button {
    min-width: 40px;
    min-height: 40px;
    padding: 6px 10px;

    font-size: 15px;
    font-weight: 500;
}

/* STAMMDATEN-KACHELN (ÜBERSICHT) */

main > h3 {
    margin: 0 0 30px;

    font-size: 23px;
    font-weight: 750;
    letter-spacing: -0.6px;
    line-height: 1.35;
}

.stammdaten_container {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;

    width: 100%;
}

.stammdaten {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;

    min-height: 110px;
    padding: 26px 32px;

    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 14px;

    box-shadow: 0 5px 20px var(--farbe-schatten);

    cursor: pointer;
    overflow: hidden;

    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

.stammdaten::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 5px;

    background: var(--farbe-primaer);
}

.stammdaten::after {
    content: "";

    position: absolute;
    right: 29px;
    top: 50%;

    width: 9px;
    height: 9px;

    border-right: 2px solid var(--farbe-primaer-dunkel);
    border-top: 2px solid var(--farbe-primaer-dunkel);

    transform: translateY(-50%) rotate(45deg);

    transition: right 0.2s ease;
}

.stammdaten:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);

    box-shadow: 0 8px 26px var(--farbe-schatten);

    transform: translateY(-2px);
}

.stammdaten:hover::after {
    right: 25px;
}

.stammdaten:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 3px;
}

.stammdaten h4 {
    margin: 0;

    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
}

.stammdaten p {
    margin: 0 30px 0 auto;
    padding: 7px 13px;

    font-size: 13px;
    font-weight: 700;

    color: var(--farbe-primaer-dunkel);
    background: var(--farbe-primaer-hell);

    border-radius: 8px;
}

.stammdaten:last-child {
    grid-column: 1 / -1;
}

/* FORTSCHRITT (ÜBERSICHT) */

.fortschritt {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;

    margin: 28px 0 0;

    font-size: 13px;
    font-weight: 650;
    color: var(--farbe-text-sekundaer);
}

.fortschritt span {
    padding: 6px 12px;

    background: var(--farbe-status-frei-hintergrund);
    color: var(--farbe-status-frei-text);

    border-radius: 8px;
}

.fortschritt span.erledigt {
    background: var(--farbe-status-normal-hintergrund);
    color: var(--farbe-status-normal-text);
}

.fortschritt button {
    min-height: 32px;
    margin-left: auto;
    padding: 5px 12px;

    font-size: 12px;
    font-weight: 650;
    color: var(--farbe-text-sekundaer);
}

/* SMARTPHONE */

@media (max-width: 600px) {

    header {
        min-height: 74px;
        padding: 16px 18px;
    }

    header h2 {
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        font-size: 12px;
    }

    main {
        padding: 32px 18px 60px;
    }

    main > button:first-child {
        margin-bottom: 22px;
    }

    .karte {
        border-radius: 11px;
    }

    .karte h3 {
        padding: 22px 20px;
        font-size: 19px;
    }

    .karte h3::before {
        top: 21px;
        bottom: 21px;
    }

    .inhalt {
        padding: 22px 20px;
    }

    .zeile {
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
    }

    .feld.schmal,
    .feld.fest {
        flex: 1;
    }

    .feld.fest button {
        width: 100%;
    }

    th,
    td,
    td.leer {
        padding: 12px 8px;
        font-size: 13px;
    }

    main > h3 {
        font-size: 20px;
        margin-bottom: 24px;
    }

    .stammdaten_container {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .stammdaten {
        min-height: 84px;
        padding: 20px 24px;
        border-radius: 11px;
    }

    .stammdaten:last-child {
        grid-column: auto;
    }

    .stammdaten h4 {
        font-size: 16px;
    }

    .fortschritt button {
        margin-left: 0;
    }
}

/* REDUZIERTE ANIMATIONEN */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

/* GEFÜHRTE STAMMDATENERSTELLUNG */

body:not(.gefuehrt) .nur-gefuehrt {
    display: none !important;
}

    </style>
</head>
<body>
<script>if (GEFUEHRT) document.body.classList.add("gefuehrt");</script>
<header>
    <h2>Klassen | Schuljahr 2026/27</h2>
    <button onclick="logout()">Logout</button>
</header>
<main>
    <button onclick="zurUebersicht()">Zurück zur Übersicht</button>

    <div id="meldung" role="status"></div>

    <div class="karte">
        <h3>Klasse erstellen <span class="nur-gefuehrt">Schritt 2 von 4</span></h3>
        <form class="inhalt" id="formular" novalidate>
            <div class="zeile">
                <div class="feld">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="z. B. 5BI" autocomplete="off">
                </div>
                <div class="feld">
                    <label for="abteilung">Abteilung</label>
                    <select id="abteilung"></select>
                </div>
            </div>

            <div class="zeile">
                <div class="feld">
                    <label for="stufe">Schulstufe</label>
                    <select id="stufe">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>
                </div>
                <div class="feld">
                    <label for="schueler">Schülerzahl (Prognose)</label>
                    <input type="number" id="schueler" min="1" max="40" placeholder="z. B. 24">
                </div>
            </div>

            <p class="hinweis" id="keine-abteilung" hidden>
                Noch keine Abteilungen vorhanden – bitte zuerst
                <a href="javascript:redirect('Admin_Abteilungen_Ansicht.html')">Abteilungen anlegen</a>.
            </p>

            <div class="leiste">
                <button class="primaer" type="submit">Speichern</button>
            </div>
        </form>
    </div>

    <div class="karte">
        <h3>Angelegte Klassen <span id="anzahl"></span></h3>
        <div class="tabelle">
            <table>
                <thead>
                    <tr><th>Name</th><th>Abteilung</th><th>Schulstufe</th><th>Schülerzahl</th><th>Löschen</th></tr>
                </thead>
                <tbody id="liste"></tbody>
            </table>
        </div>
    </div>

    <div class="leiste verteilt nur-gefuehrt">
        <button onclick="redirect('Admin_Abteilungen_Ansicht.html')">Zurück</button>
        <button class="primaer" onclick="redirect('Admin_Faecher_Ansicht.html')">Weiter</button>
    </div>
</main>
<script>
    function anzeigen() {
        const daten = laden();
        el("anzahl").textContent = "(" + daten.klassen.length + ")";
        el("liste").innerHTML = daten.klassen.length
            ? daten.klassen.map((k, i) =>
                "<tr><td>" + esc(k.name) + "</td><td>" + esc(k.abteilung) + "</td><td>" +
                k.stufe + "</td><td>" + k.schueler + "</td>" + loeschButton(i, k.name) + "</tr>").join("")
            : leereZeile(5, "Noch keine Klassen angelegt");
    }

    const abteilungen = laden().abteilungen;
    el("abteilung").innerHTML = abteilungen.map(a => "<option>" + esc(a) + "</option>").join("");
    el("keine-abteilung").hidden = abteilungen.length > 0;

    /* Schulstufe aus dem Klassennamen vorschlagen (5BI -> 5) */
    el("name").addEventListener("input", () => {
        const ziffer = el("name").value.trim().charAt(0);
        if (ziffer >= "1" && ziffer <= "5") el("stufe").value = ziffer;
    });

    el("formular").addEventListener("submit", e => {
        e.preventDefault();
        const daten = laden();
        const name = el("name").value.trim().toUpperCase();
        const abteilung = el("abteilung").value;
        const schueler = parseInt(el("schueler").value, 10);

        if (!name) return meldung("Bitte einen Klassennamen eingeben.", true);
        if (!abteilung) return meldung("Bitte zuerst eine Abteilung anlegen.", true);
        if (!(schueler > 0)) return meldung("Bitte die prognostizierte Schülerzahl angeben.", true);
        if (daten.klassen.some(k => gleich(k.name, name)))
            return meldung("Die Klasse „" + name + "“ gibt es bereits.", true);

        daten.klassen.push({
            name: name,
            abteilung: abteilung,
            stufe: Number(el("stufe").value),
            schueler: schueler
        });
        speichern(daten);

        el("name").value = "";
        el("schueler").value = "";
        el("name").focus();
        meldung("Klasse „" + name + "“ gespeichert.");
        anzeigen();
    });

    el("liste").addEventListener("click", e => {
        const button = e.target.closest("button");
        if (!button) return;

        const daten = laden();
        const klasse = daten.klassen.splice(Number(button.dataset.index), 1)[0];
        speichern(daten);

        meldung("Klasse „" + klasse.name + "“ gelöscht.");
        anzeigen();
    });

    anzeigen();
</script>
</body>
