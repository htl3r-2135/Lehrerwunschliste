<!-- Claude Sonnet 5.5 verwendet für Inhalte und JS-Logik -->

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wünsche bearbeiten</title>
  <link rel="stylesheet" href="lehrer.css">
</head>
<body>

  <header>
    <div class="logo">LOGO</div>
    <div class="info">Lehrer: BAY | Frist: 15.04. (noch 12 Tage)</div>
    <nav>
      <a href="Lehrer_ansicht.html">Wünsche</a>
      <a href="profil_kompetenzen.html">Profil / Kompetenzen</a>
      <a href="Anmeldung.html">Logout</a>
    </nav>
  </header>

  <main>
    <h1>Wünsche bearbeiten</h1>

    <div class="zeile">
      <div>
        <label for="stufe">Schulstufe</label>
        <select id="stufe" aria-describedby="stufe-fehler">
          <option value="" disabled selected>– Schulstufe wählen –</option>
          <option value="1">1. Klasse</option>
          <option value="2">2. Klasse</option>
          <option value="3">3. Klasse</option>
          <option value="4">4. Klasse</option>
          <option value="5">5. Klasse</option>
        </select>
        <p class="fehler" id="stufe-fehler" hidden></p>
      </div>

      <div>
        <label for="klasse">Klasse</label>
        <select id="klasse" disabled aria-describedby="klasse-fehler">
          <option value="" disabled selected>– zuerst Schulstufe wählen –</option>
        </select>
        <p class="fehler" id="klasse-fehler" hidden></p>
      </div>

      <div>
        <label for="fach">Fach</label>
        <select id="fach" disabled aria-describedby="fach-fehler">
          <option value="" disabled selected>– zuerst Klasse wählen –</option>
        </select>
        <p class="fehler" id="fach-fehler" hidden></p>
      </div>

      <div class="schmal">
        <label for="std">Std.</label>
        <input id="std" type="number" value="" placeholder="–" readonly>
      </div>

      <div class="voll">
        <label for="wunsch-nachricht">Nachricht an Fachverantwortliche(n) zu diesem Wunsch (optional)</label>
        <textarea id="wunsch-nachricht" rows="2" maxlength="300"></textarea>
      </div>
    </div>

    <button type="button" class="btn" id="add-wunsch">+ Wunsch hinzufügen</button>

    <h2 style="font-size:1.1em; margin-top:24px;">Meine Wünsche</h2>
    <table>
      <thead>
        <tr><th>Klasse</th><th>Fach</th><th>Std.</th><th>Nachricht</th><th></th></tr>
      </thead>
      <tbody id="wuensche-tbody">
      </tbody>
    </table>

    <p id="zusammenfassung">Stundenausmaß 20 | Eingetragen 8 | Rest 12</p>

    <div class="leiste">
      <a class="btn" href="Lehrer_ansicht.html">Abbrechen</a>
      <button type="button" class="btn" id="save-btn">Save</button>
    </div>
  </main>

  <script>
    const AUSMASS = 20;
    const STORAGE_KEY = "lehrer_wuensche_bay";

    const STANDARD_WUENSCHE = [
      { klasse: "5BI", fach: "MEDT", std: 3, nachricht: "" },
      { klasse: "5AX", fach: "WebTech Übung", std: 2, nachricht: "" },
      { klasse: "4CN", fach: "AM", std: 3, nachricht: "" }
    ];

    const FAECHER = {
      "BI-1": [["Programmieren", 3], ["Mathematik", 2]],
      "BI-2": [["Programmieren", 3], ["Netzwerktechnik", 2]],
      "BI-3": [["Datenbanken", 2], ["SYT", 3]],
      "BI-4": [["SYT", 2], ["Datenbanken", 2], ["WebTech Übung", 3]],
      "BI-5": [["MEDT", 3], ["SYT", 2]],
      "AX-1": [["Programmieren", 3], ["Mathematik", 2]],
      "AX-2": [["Programmieren", 3], ["Grafik", 2]],
      "AX-3": [["WebTech", 3], ["Grafik", 2]],
      "AX-4": [["WebTech", 3], ["Multimedia", 2]],
      "AX-5": [["WebTech Übung", 2], ["Multimedia", 2]],
      "CN-1": [["Netzwerktechnik", 3], ["Mathematik", 2]],
      "CN-2": [["Netzwerktechnik", 3], ["Elektronik", 2]],
      "CN-3": [["NWT", 2], ["AM", 3]],
      "CN-4": [["AM", 3], ["NWT", 2]],
      "CN-5": [["NWT", 3], ["AM", 2]]
    };

    const ABTEILUNGEN = ["BI", "AX", "CN"];
    const KLASSEN = [];
    for (let stufeNr = 1; stufeNr <= 5; stufeNr++) {
      for (const abt of ABTEILUNGEN) {
        KLASSEN.push({ name: stufeNr + abt, stufe: stufeNr, gruppe: abt + "-" + stufeNr });
      }
    }

    const stufe = document.getElementById("stufe");
    const klasse = document.getElementById("klasse");
    const fach = document.getElementById("fach");
    const std = document.getElementById("std");
    const wunschNachricht = document.getElementById("wunsch-nachricht");
    const addButton = document.getElementById("add-wunsch");
    const saveButton = document.getElementById("save-btn");
    const tbody = document.getElementById("wuensche-tbody");
    const zusammenfassung = document.getElementById("zusammenfassung");

    let gewaehlteStufe = null;
    let gewaehlteKlasse = null;

    function datenAuslesen() {
      try {
        if (window.name && window.name.startsWith("WUENSCHE:")) {
          return JSON.parse(window.name.slice("WUENSCHE:".length));
        }
      } catch (e) {}

      try {
        const params = new URLSearchParams(window.location.search);
        if (params.has("wuensche")) {
          return JSON.parse(params.get("wuensche"));
        }
      } catch (e) {}

      try {
        const gespeichert = localStorage.getItem(STORAGE_KEY);
        if (gespeichert) return JSON.parse(gespeichert);
      } catch (e) {}

      return STANDARD_WUENSCHE;
    }

    function datenSpeichern(liste) {
      const json = JSON.stringify(liste);
      window.name = "WUENSCHE:" + json;
      try {
        localStorage.setItem(STORAGE_KEY, json);
      } catch (e) {}
    }

    function zeigeFehler(element, nachricht) {
      const fehler = document.getElementById(element.id + "-fehler");
      if (fehler) {
        fehler.textContent = nachricht;
        fehler.hidden = false;
      }
      element.setAttribute("aria-invalid", "true");
    }

    function loescheFehler(element) {
      const fehler = document.getElementById(element.id + "-fehler");
      if (fehler) {
        fehler.textContent = "";
        fehler.hidden = true;
      }
      element.removeAttribute("aria-invalid");
    }

    function zelle(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    function platzhalterOption(text) {
      const option = document.createElement("option");
      option.value = "";
      option.textContent = text;
      option.disabled = true;
      option.selected = true;
      return option;
    }

    function faecherZuruecksetzen() {
      fach.replaceChildren(platzhalterOption("– zuerst Klasse wählen –"));
      fach.disabled = true;
      std.value = "";
    }

    function faecherFuellen(k) {
      fach.replaceChildren(platzhalterOption("– Fach wählen –"));
      for (const eintrag of FAECHER[k.gruppe]) {
        const option = document.createElement("option");
        option.value = eintrag[0];
        option.textContent = eintrag[0];
        option.dataset.std = eintrag[1];
        fach.appendChild(option);
      }
      fach.disabled = false;
      std.value = "";
    }

    function zeileErstellen(klassenName, fachName, stunden, nachrichtText) {
      const tr = document.createElement("tr");
      tr.appendChild(zelle(klassenName));
      tr.appendChild(zelle(fachName));
      tr.appendChild(zelle(stunden));

      const nachrichtZelle = document.createElement("td");
      const nachrichtFeld = document.createElement("input");
      nachrichtFeld.type = "text";
      nachrichtFeld.className = "nachricht-feld";
      nachrichtFeld.maxLength = 300;
      nachrichtFeld.value = nachrichtText || "";
      nachrichtFeld.setAttribute("aria-label", "Nachricht zu " + klassenName + " " + fachName);
      nachrichtZelle.appendChild(nachrichtFeld);
      tr.appendChild(nachrichtZelle);

      const loeschZelle = document.createElement("td");
      const loeschButton = document.createElement("button");
      loeschButton.type = "button";
      loeschButton.className = "btn loeschen";
      loeschButton.setAttribute("aria-label", "Wunsch entfernen");
      loeschButton.textContent = "✕";
      loeschZelle.appendChild(loeschButton);
      tr.appendChild(loeschZelle);

      tbody.appendChild(tr);
    }

    function wuenscheLaden() {
      const liste = datenAuslesen();
      tbody.replaceChildren();
      for (const w of liste) {
        zeileErstellen(w.klasse, w.fach, w.std, w.nachricht);
      }
      zusammenfassungAktualisieren();
    }

    stufe.addEventListener("change", function () {
      gewaehlteStufe = Number(stufe.value);
      gewaehlteKlasse = null;

      loescheFehler(stufe);
      loescheFehler(klasse);
      loescheFehler(fach);

      klasse.replaceChildren(platzhalterOption("– Klasse wählen –"));
      for (const k of KLASSEN) {
        if (k.stufe !== gewaehlteStufe) continue;
        const option = document.createElement("option");
        option.value = k.name;
        option.textContent = k.name;
        klasse.appendChild(option);
      }

      klasse.disabled = false;
      faecherZuruecksetzen();
    });

    klasse.addEventListener("change", function () {
      loescheFehler(klasse);

      const treffer = KLASSEN.find(function (k) {
        return k.stufe === gewaehlteStufe && k.name === klasse.value;
      });

      if (treffer) {
        gewaehlteKlasse = treffer;
        loescheFehler(fach);
        faecherFuellen(treffer);
      } else {
        gewaehlteKlasse = null;
        faecherZuruecksetzen();
      }
    });

    fach.addEventListener("change", function () {
      loescheFehler(fach);
      std.value = fach.selectedOptions[0].dataset.std;
    });

    function zusammenfassungAktualisieren() {
      let summe = 0;
      for (const zeile of tbody.rows) {
        summe += Number(zeile.cells[2].textContent);
      }
      zusammenfassung.textContent =
        "Stundenausmaß " + AUSMASS + " | Eingetragen " + summe + " | Rest " + (AUSMASS - summe);
    }

    addButton.addEventListener("click", function () {
      loescheFehler(stufe);
      loescheFehler(klasse);
      loescheFehler(fach);

      if (!gewaehlteStufe) {
        zeigeFehler(stufe, "Bitte eine Schulstufe wählen.");
        return;
      }
      if (klasse.value.trim() === "") {
        zeigeFehler(klasse, "Bitte eine Klasse wählen.");
        return;
      }
      if (!gewaehlteKlasse) {
        zeigeFehler(klasse, "Diese Klasse gibt es in der " + gewaehlteStufe + ". Klasse nicht. Bitte aus der Liste wählen.");
        return;
      }
      if (!fach.value) {
        zeigeFehler(fach, "Bitte ein Fach wählen.");
        return;
      }

      for (const zeile of tbody.rows) {
        if (zeile.cells[0].textContent === gewaehlteKlasse.name &&
            zeile.cells[1].textContent === fach.value) {
          zeigeFehler(fach, "Diesen Wunsch gibt es bereits.");
          return;
        }
      }

      zeileErstellen(gewaehlteKlasse.name, fach.value, std.value, wunschNachricht.value);

      fach.selectedIndex = 0;
      std.value = "";
      wunschNachricht.value = "";

      zusammenfassungAktualisieren();
    });

    tbody.addEventListener("click", function (event) {
      const button = event.target.closest(".loeschen");
      if (!button) return;
      button.closest("tr").remove();
      zusammenfassungAktualisieren();
    });

    saveButton.addEventListener("click", function () {
      const aktuelleWuensche = [];
      for (const zeile of tbody.rows) {
        aktuelleWuensche.push({
          klasse: zeile.cells[0].textContent,
          fach: zeile.cells[1].textContent,
          std: Number(zeile.cells[2].textContent),
          nachricht: zeile.querySelector(".nachricht-feld").value.trim()
        });
      }

      datenSpeichern(aktuelleWuensche);
      window.location.href = "Lehrer_ansicht.html?wuensche=" + encodeURIComponent(JSON.stringify(aktuelleWuensche));
    });

    wuenscheLaden();
  </script>
</body>
</html>
