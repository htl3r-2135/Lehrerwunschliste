<!DOCTYPE html>
<html lang="de">
<head>
    <title>Lehrer erstellen</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
/* ------------------------------------------
           Gemeinsame Prototyp-Logik (in allen Admin-
           Stammdaten-Seiten gleich).
           Die Daten liegen im localStorage des Browsers.
           ------------------------------------------ */

        const SPEICHER_KEY = "lwl.stammdaten.v1";

        const STANDARD_DATEN = {
            abteilungen: ["WEBT", "Informationstechnologie", "Mechatronik"],
            klassen: [
                { name: "4CN", abteilung: "Informationstechnologie", stufe: 4, schueler: 22 },
                { name: "5CN", abteilung: "Informationstechnologie", stufe: 5, schueler: 21 },
                { name: "5AX", abteilung: "WEBT", stufe: 5, schueler: 23 }
            ],
            faecher: [],
            lehrer: []
        };

        let zwischenspeicher = null;

        function laden() {
            let daten = null;
            try {
                daten = JSON.parse(localStorage.getItem(SPEICHER_KEY));
            } catch (e) {}
            if (!daten) daten = zwischenspeicher;
            if (!daten) daten = JSON.parse(JSON.stringify(STANDARD_DATEN));
            for (const liste of ["abteilungen", "klassen", "faecher", "lehrer"]) {
                if (!Array.isArray(daten[liste])) daten[liste] = [];
            }
            return daten;
        }

        function speichern(daten) {
            zwischenspeicher = daten;
            try {
                localStorage.setItem(SPEICHER_KEY, JSON.stringify(daten));
            } catch (e) {}
        }

        /* Wurde die Seite über Admin_Uebersicht.html geöffnet (?start=neu),
           führt "Zurück" wieder dorthin – sonst zu Admin_Ansicht.html. */

        const VON_NEUER_UEBERSICHT =
            new URLSearchParams(window.location.search).get("start") === "neu";

        const STARTSEITE = VON_NEUER_UEBERSICHT
            ? "Admin_Uebersicht.html"
            : "Admin_Ansicht.html";

        function logout() {
            window.location.href = "Anmeldung.html";
        }

        /* Geführte Stammdatenerstellung (?gefuehrt=1): nur dann werden
           "Schritt X von 4" und die Zurück/Weiter-Leiste angezeigt. */
        const GEFUEHRT =
            new URLSearchParams(window.location.search).get("gefuehrt") === "1";

        function redirect(file) {
            const parameter = [];
            if (VON_NEUER_UEBERSICHT) parameter.push("start=neu");
            if (GEFUEHRT) parameter.push("gefuehrt=1");
            window.location.href = file + (parameter.length ? "?" + parameter.join("&") : "");
        }

        function zurUebersicht(from) {
            window.location.href = STARTSEITE + (from ? "?from=" + encodeURIComponent(from) : "");
        }

        function el(id) {
            return document.getElementById(id);
        }

        function esc(text) {
            return String(text).replace(/[&<>"']/g, zeichen => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[zeichen]));
        }

        function gleich(a, b) {
            return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
        }

        function meldung(text, fehler) {
            const box = el("meldung");
            box.textContent = text;
            box.className = "sichtbar" + (fehler ? " fehler" : "");
        }

        function loeschButton(index, name) {
            return '<td class="loeschen"><button type="button" data-index="' + index +
                '" aria-label="' + esc(name) + ' löschen">✕</button></td>';
        }

        function leereZeile(spalten, text) {
            return '<tr><td class="leer" colspan="' + spalten + '">' + text + '</td></tr>';
        }
    </script>
    <style>

<body>
<script>if (GEFUEHRT) document.body.classList.add("gefuehrt");</script>
<header>
    <h2>Lehrer | Schuljahr 2026/27</h2>
    <button onclick="logout()">Logout</button>
</header>
<main>
    <button onclick="zurUebersicht()">Zurück zur Übersicht</button>

    <div id="meldung" role="status"></div>

    <div class="karte">
        <h3>Lehrer erstellen <span class="nur-gefuehrt">Schritt 4 von 4</span></h3>
        <form class="inhalt" id="formular" novalidate>
            <div class="zeile">
                <div class="feld schmal">
                    <label for="kuerzel">Kürzel</label>
                    <input type="text" id="kuerzel" maxlength="3" autocomplete="off">
                </div>
                <div class="feld">
                    <label for="name">Name</label>
                    <input type="text" id="name" autocomplete="off">
                </div>
            </div>

            <div class="zeile">
                <div class="feld">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" autocomplete="off">
                </div>
                <div class="feld schmal">
                    <label for="stunden">Wochenstd.</label>
                    <input type="number" id="stunden" min="1" max="30">
                </div>
            </div>

            <label class="schalter">
                <input type="checkbox" id="verantwortlich">
                Fachverantwortliche(r)
            </label>

            <div id="fach-auswahl" hidden>
                <span class="beschriftung">Fachverantwortlich für</span>
                <div class="tags" id="faecher-tags"></div>
                <p class="hinweis" id="faecher-hinweis">Mindestens ein Fach auswählen.</p>
            </div>

            <div class="leiste verteilt">
                <p class="hinweis">→ Lehrer erhält E-Mail mit OTP zur Anmeldung</p>
                <button class="primaer" type="submit">Speichern</button>
            </div>
        </form>
    </div>

    <div class="karte">
        <h3>Angelegte Lehrer <span id="anzahl"></span></h3>
        <div class="tabelle">
            <table>
                <thead>
                    <tr><th>Kürzel</th><th>Name</th><th>E-Mail</th><th>Std.</th><th>Fachverantwortlich für</th><th>Löschen</th></tr>
                </thead>
                <tbody id="liste"></tbody>
            </table>
        </div>
    </div>

    <div class="leiste verteilt nur-gefuehrt">
        <button onclick="redirect('Admin_Faecher_Ansicht.html')">Zurück</button>
        <button class="primaer" onclick="zurUebersicht('Stammdaten')">Fertig</button>
    </div>
</main>
<script>
    const EMAIL_ENDUNG = "@htl.rennweg.at";
    let emailSelbstGeaendert = false;

    function anzeigen() {
        const daten = laden();
        el("anzahl").textContent = "(" + daten.lehrer.length + ")";
        el("liste").innerHTML = daten.lehrer.length
            ? daten.lehrer.map((l, i) =>
                "<tr><td>" + esc(l.kuerzel) + "</td><td>" + esc(l.name) + "</td><td>" +
                esc(l.email) + "</td><td>" + (l.stunden || "–") + "</td><td>" +
                (l.verantwortlichFuer && l.verantwortlichFuer.length ? esc(l.verantwortlichFuer.join(", ")) : "–") +
                "</td>" + loeschButton(i, l.kuerzel) + "</tr>").join("")
            : leereZeile(6, "Noch keine Lehrer angelegt");
    }

    /* Fächer aus den Stammdaten als Auswahl anzeigen */
    function faecherAnzeigen() {
        const faecher = laden().faecher;
        el("faecher-tags").innerHTML = faecher.map(f =>
            '<label><input type="checkbox" name="fach" value="' + esc(f.name) + '"> ' + esc(f.name) + '</label>'
        ).join("");
        el("faecher-hinweis").innerHTML = faecher.length
            ? "Mindestens ein Fach auswählen."
            : 'Noch keine Fächer angelegt – zuerst unter <a href="#" onclick="redirect(\'Admin_Faecher_Ansicht.html\'); return false;">Fächer</a> anlegen.';
    }

    function verantwortlichUmschalten() {
        el("fach-auswahl").hidden = !el("verantwortlich").checked;
    }

    el("verantwortlich").addEventListener("change", verantwortlichUmschalten);

    /* E-Mail aus dem Kürzel vorschlagen (MUS -> mus@htl.rennweg.at) */
    el("kuerzel").addEventListener("input", () => {
        el("kuerzel").value = el("kuerzel").value.toUpperCase();
        if (!emailSelbstGeaendert) {
            const kuerzel = el("kuerzel").value.trim().toLowerCase();
            el("email").value = kuerzel ? kuerzel + EMAIL_ENDUNG : "";
        }
    });

    el("email").addEventListener("input", () => {
        emailSelbstGeaendert = el("email").value !== "";
    });

    el("formular").addEventListener("submit", e => {
        e.preventDefault();
        const daten = laden();
        const kuerzel = el("kuerzel").value.trim().toUpperCase();
        const name = el("name").value.trim();
        const email = el("email").value.trim().toLowerCase();
        const stunden = parseInt(el("stunden").value, 10);

        if (!/^[A-ZÄÖÜ]{3}$/.test(kuerzel))
            return meldung("Bitte ein Kürzel mit genau 3 Buchstaben eingeben.", true);
        if (!name) return meldung("Bitte einen Namen eingeben.", true);
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
            return meldung("Bitte eine gültige E-Mail-Adresse eingeben.", true);
        if (daten.lehrer.some(l => gleich(l.kuerzel, kuerzel)))
            return meldung("Das Kürzel „" + kuerzel + "“ ist bereits vergeben.", true);
        if (daten.lehrer.some(l => gleich(l.email, email)))
            return meldung("Die E-Mail-Adresse „" + email + "“ ist bereits vergeben.", true);
        if (!(stunden > 0))
            return meldung("Bitte die Stundenanzahl angeben.", true);

        const verantwortlich = el("verantwortlich").checked;
        const verantwortlichFuer = verantwortlich
            ? [...document.querySelectorAll("#faecher-tags input:checked")].map(c => c.value)
            : [];
        if (verantwortlich && !verantwortlichFuer.length)
            return meldung("Bitte mindestens ein Fach auswählen, für das der Lehrer fachverantwortlich ist.", true);


        daten.lehrer.push({ kuerzel: kuerzel, name: name, email: email, stunden: stunden,
            verantwortlichFuer: verantwortlichFuer });
        speichern(daten);

        el("formular").reset();
        emailSelbstGeaendert = false;
        verantwortlichUmschalten();
        el("kuerzel").focus();
        meldung("Lehrer „" + kuerzel + "“ gespeichert – OTP-E-Mail an " + email + " gesendet (im Prototyp nur simuliert).");
        anzeigen();
    });

    el("liste").addEventListener("click", e => {
        const button = e.target.closest("button");
        if (!button) return;

        const daten = laden();
        const lehrer = daten.lehrer.splice(Number(button.dataset.index), 1)[0];
        speichern(daten);

        meldung("Lehrer „" + lehrer.kuerzel + "“ gelöscht.");
        anzeigen();
    });

    faecherAnzeigen();
    anzeigen();
</script>
</body>
</html>
