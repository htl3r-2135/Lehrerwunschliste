<!DOCTYPE html>
<html lang="de">
<head>
    <title>Anmeldung</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function redirect(file) {
            window.location.href = file;
        }

        function login() {
            const email = document.getElementById("email").value.trim();
            const passwort = document.getElementById("passwort").value;

            if (!emailValidator() || passwort === "") {
                console.log(emailValidator());
                alert("Bitte valide E-Mail und Passwort eingeben");
                return;
            }

            switch(email.toLowerCase()) {
                case "bay@htl.rennweg.at":
                    redirect("Fachverantwortliche_Ansicht.html");
                break;     
                case "sdo@htl.rennweg.at":
                    redirect("Admin_Ansicht.html");
                break;
                case "swr@htl.rennweg.at":
                    redirect("Lehrer_Ansicht.html");
                break;
                default:
                    alert("Diesen User gibt es nicht. Bitte überprüfen Sie die E-Mail-Adresse.");
                break;
            }    
            
        }

        function passwortZuruecksetzen() {
            const email = document.getElementById("email").value.trim();
            if (!emailValidator()) {
                alert("Bitte geben Sie Ihre E-Mail-Adresse ein, um das Passwort zurückzusetzen.");
                return;
            }else {
                redirect("Passwort_aendern.html");
            }
        }

        function emailValidator() {
            const email = document.getElementById("email").value.trim();
            const checker = /[a-z]{3}@htl.rennweg.at$/;
            if (checker.test(email.toLowerCase())) {
                return true
            }
            return false;
        }

        function microsoftLogin() {
            // TODO: Microsoft-Anmeldung anbinden
            alert("Microsoft-Anmeldung ist noch nicht verbunden");
        }
    </script>
    <style>


@import url("farben.css");

/* ==========================================
   LWL – ANMELDUNG
   Einheitliches LWL-Design
   ========================================== */

/* GRUNDEINSTELLUNGEN */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Arial, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 100vh;
    margin: 0;
    padding: 28px 18px;

    background: var(--farbe-hintergrund);
    color: var(--farbe-text);

    font-size: 14px;
    line-height: 1.5;
}

/* ==========================================
   HAUPTBEREICH
   ========================================== */

main {
    width: 100%;
    max-width: 520px;
}

/* ==========================================
   LOGIN-KARTE
   ========================================== */

.login_container {
    position: relative;

    width: 100%;
    padding: 44px 48px 38px;

    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 15px;

    box-shadow:
        0 7px 24px var(--farbe-schatten);

    overflow: hidden;
}

/* GELBER AKZENT LINKS */

.login_container::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 5px;
    background: var(--farbe-primaer);
}

/* ==========================================
   ÜBERSCHRIFT
   ========================================== */

.login_container h3 {
    margin: 0 0 36px;

    text-align: center;

    font-size: 24px;
    font-weight: 750;
    letter-spacing: -0.6px;
    line-height: 1.3;

    color: var(--farbe-text);
}

/* ==========================================
   FORMULARFELDER
   ========================================== */

.feld {
    display: flex;
    flex-direction: column;
    gap: 8px;

    margin-bottom: 22px;
}

/* LABEL */

.feld label {
    font-size: 13px;
    font-weight: 650;
    color: var(--farbe-text);
}

/* INPUT */

.feld input {
    width: 100%;
    min-height: 46px;
    padding: 12px 15px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 500;

    color: var(--farbe-text);
    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    outline: none;

    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

/* INPUT HOVER */

.feld input:hover {
    border-color: var(--farbe-primaer);
}

/* INPUT FOKUS */

.feld input:focus {
    border-color: var(--farbe-primaer);

    box-shadow:
        0 0 0 3px var(--farbe-primaer-hell);
}

/* ==========================================
   BUTTONS – ALLGEMEIN
   ========================================== */

button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 44px;
    padding: 12px 22px;

    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;

    color: var(--farbe-text);
    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

button:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);
}

button:active {
    transform: translateY(1px);
}

button:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 3px;
}

/* ==========================================
   PASSWORT ZURÜCKSETZEN
   ========================================== */

.button_klein {
    align-self: flex-end;

    min-height: 32px;
    margin-top: 2px;
    padding: 5px 10px;

    font-size: 12px;
    font-weight: 650;

    color: var(--farbe-primaer-dunkel);
    background: transparent;

    border: 1px solid transparent;
    border-radius: 7px;
}

.button_klein:hover {
    background: var(--farbe-primaer-hell);
    border-color: transparent;
}

/* ==========================================
   LOGIN-BEREICH
   ========================================== */

.buttons {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 15px;

    margin-top: 28px;
}

/* LOGIN – PRIMÄRAKTION */

.button_login {
    width: 100%;
    min-height: 47px;

    background: var(--farbe-primaer);
    border-color: var(--farbe-primaer);

    color: var(--farbe-text);
    font-size: 14px;
}

.button_login:hover {
    background: var(--farbe-primaer-hover);
    border-color: var(--farbe-primaer-hover);
}

/* ODER-TRENNUNG */

.oder {
    display: flex;
    align-items: center;
    gap: 15px;

    width: 100%;
    margin: 3px 0;

    color: var(--farbe-text-sekundaer);

    font-size: 12px;
    text-align: center;
    white-space: nowrap;
}

.oder::before,
.oder::after {
    content: "";

    height: 1px;
    flex: 1;

    background: var(--farbe-rahmen);
}

/* MICROSOFT-LOGIN */

.button_microsoft {
    width: 100%;
    min-height: 47px;

    background: var(--farbe-oberflaeche);
    border: 1px solid var(--farbe-rahmen);

    color: var(--farbe-text);
    font-size: 14px;
}

.button_microsoft:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);
}

/* ==========================================
   SMARTPHONE
   ========================================== */

@media (max-width: 600px) {

    body {
        padding: 20px 14px;
    }

    main {
        max-width: 100%;
    }

    .login_container {
        padding: 34px 24px 30px;
        border-radius: 12px;
    }

    .login_container h3 {
        font-size: 21px;
        margin-bottom: 28px;
    }

    .feld {
        margin-bottom: 18px;
    }

    .feld input {
        min-height: 44px;
    }

    .buttons {
        margin-top: 24px;
        gap: 12px;
    }

    .button_login,
    .button_microsoft {
        min-height: 46px;
    }
}

/* ==========================================
   REDUZIERTE ANIMATIONEN
   ========================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

    </style>
</head>
<body>
<main>
    <div class="login_container">
        <h3>Lehrer-Wunschliste</h3>

        <div class="feld">
            <label for="email">E-Mail</label>
            <input type="email" id="email" autocomplete="username">
        </div>

        <div class="feld">
            <label for="passwort">Passwort</label>
            <input type="password" id="passwort" autocomplete="current-password">
            <button class="button_klein" onclick="passwortZuruecksetzen()">Passwort zurücksetzen</button>
        </div>

        <div class="buttons">
            <button class="button_login" onclick="login()">Login</button>
            <p class="oder">– oder –</p>
            <button class="button_microsoft" onclick="microsoftLogin()">Mit Microsoft anmelden</button>
        </div>
    </div>
</main>
</body>
</html>
