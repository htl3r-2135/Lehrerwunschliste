<!DOCTYPE html>
<html lang="de">
<head>
    <title>Anmeldung</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function redirect(file) {
            window.location.href = file;
        }

        function login() {
            const email = document.getElementById("email").value.trim();
            const passwort = document.getElementById("passwort").value;

            if (email === "" || passwort === "") {
                alert("Bitte E-Mail und Passwort eingeben");
                return;
            }

            // TODO: Anmeldung am Server pruefen, danach Weiterleitung je nach Rolle
            redirect("Admin_Ansicht.html");
        }

        function microsoftLogin() {
            // TODO: Microsoft-Anmeldung anbinden
            alert("Microsoft-Anmeldung ist noch nicht verbunden");
        }
    </script>
    <style>

@import url("farben.css");

/* GRUNDEINSTELLUNGEN */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--farbe-text);
    background: var(--farbe-hintergrund);
}

/* HAUPTBEREICH */

main {
    width: 100%;
    max-width: 560px;

    margin: 0 auto;
    padding: 90px 28px 90px;
}

/* KARTE */

.login_container {
    position: relative;

    padding: 42px 44px 34px;

    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 14px;

    box-shadow:
        0 5px 20px var(--farbe-schatten);

    overflow: hidden;
}

/* GELBER AKZENT LINKS */

.login_container::before {
    content: "";

    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: 5px;

    background: var(--farbe-primaer);
}

.login_container h3 {
    margin: 0 0 34px;

    font-size: 23px;
    font-weight: 750;
    letter-spacing: -0.6px;
    line-height: 1.35;
    text-align: center;
}

/* FORMULAR FELDER */

.feld {
    display: flex;
    flex-direction: column;
    gap: 7px;

    margin-bottom: 20px;
}

.feld label {
    font-size: 13px;
    font-weight: 600;
    color: var(--farbe-text);
    opacity: 0.7;
}

.feld input {
    width: 100%;
    padding: 13px 15px;

    font-family: inherit;
    font-size: 15px;

    color: var(--farbe-text);
    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}

.feld input:hover {
    background: var(--farbe-oberflaeche-sanft);
}

.feld input:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 2px;
    border-color: var(--farbe-primaer);
}

/* BUTTONS */

.buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;

    margin-top: 28px;
}

button {
    padding: 13px 26px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 650;

    color: var(--farbe-text);
    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

button:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);
}

button:active {
    transform: translateY(1px);
}

button:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 3px;
}

.button_login {
    min-width: 220px;
}

.button_microsoft {
    min-width: 280px;
}

/* KLEINER BUTTON (PASSWORT ZURUECKSETZEN) */

.button_klein {
    align-self: flex-end;

    padding: 6px 12px;

    font-size: 12px;
    font-weight: 600;

    border-radius: 7px;
}

.oder {
    margin: 0;

    font-size: 13px;
    color: var(--farbe-text);
    opacity: 0.7;
}

/* HINWEIS UNTEN */

.hinweis {
    margin: 32px 0 0;

    font-size: 13px;
    line-height: 1.5;
    color: var(--farbe-text);
    opacity: 0.75;
}

.hinweis a {
    color: var(--farbe-primaer-dunkel);
    font-weight: 700;
    text-decoration: none;
}

.hinweis a:hover {
    text-decoration: underline;
}

/* SMARTPHONE */

@media (max-width: 600px) {

    main {
        padding: 40px 18px 60px;
    }

    .login_container {
        padding: 32px 24px 26px;
        border-radius: 11px;
    }

    .login_container h3 {
        font-size: 20px;
        margin-bottom: 26px;
    }

    .button_login,
    .button_microsoft {
        width: 100%;
        min-width: 0;
    }
}

/* REDUZIERTE ANIMATIONEN */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

    </style>
</head>
<body>
<main>
    <div class="login_container">
        <h3>Lehrer-Wunschliste</h3>

        <div class="feld">
            <label for="email">E-Mail</label>
            <input type="email" id="email" autocomplete="username">
        </div>

        <div class="feld">
            <label for="passwort">Passwort</label>
            <input type="password" id="passwort" autocomplete="current-password">
            <button class="button_klein" onclick="redirect('Passwort_Aendern.html')">Passwort zurücksetzen</button>
        </div>

        <div class="buttons">
            <button class="button_login" onclick="login()">Login</button>
            <p class="oder">– oder –</p>
            <button class="button_microsoft" onclick="microsoftLogin()">Mit Microsoft anmelden</button>
        </div>

        <p class="hinweis">Erster Login: OTP per E-Mail → <a href="Passwort_Aendern.html">Passwort ändern</a></p>
    </div>
</main>
</body>
</html>
