<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fristen</title>
    <script>
        function logout() {
            window.location.href = "../Anmeldung.html";
        }

        function redirect(file) {
            window.location.href = file;
        }
    </script>
    <style>
        
@import url("../farben.css");

/* ==========================================
   LWL – FRISTEN
   Einheitliches Admin-Design
   ========================================== */

/* GRUNDEINSTELLUNGEN */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html {
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;

    background: var(--farbe-hintergrund);
    color: var(--farbe-text);

    font-size: 14px;
    line-height: 1.5;
}

/* ==========================================
   TOPBAR
   ========================================== */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;

    width: 100%;
    min-height: 88px;

    padding: 20px max(
        28px,
        calc((100vw - 1100px) / 2)
    );

    background: var(--farbe-oberflaeche);
    border-bottom: 1px solid var(--farbe-rahmen);
}

header h2 {
    margin: 0;

    font-size: 21px;
    font-weight: 750;
    letter-spacing: -0.5px;
    line-height: 1.3;
}

/* ==========================================
   BUTTONS
   ========================================== */

button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 43px;
    padding: 11px 22px;

    font-family: inherit;
    font-size: 13px;
    font-weight: 700;

    background: var(--farbe-oberflaeche);
    color: var(--farbe-text);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

button:hover {
    background: var(--farbe-oberflaeche-sanft);
    border-color: var(--farbe-primaer);
}

button:active {
    transform: translateY(1px);
}

button:focus-visible,
input:focus-visible {
    outline: 3px solid var(--farbe-fokus);
    outline-offset: 3px;
}

/* ==========================================
   HAUPTBEREICH
   ========================================== */

main {
    display: flex;
    flex-direction: column;
    align-items: stretch;

    width: 100%;
    max-width: 1100px;

    margin: 0 auto;
    padding: 55px 28px 90px;
}

/* ZURÜCK-BUTTON */

main > button:first-child {
    align-self: flex-start;

    margin-bottom: 30px;
    min-width: 90px;
}

/* ==========================================
   FRISTEN-CONTAINER
   ========================================== */

main > div {
    width: 100%;

    background: var(--farbe-oberflaeche);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 15px;

    box-shadow:
        0 7px 24px var(--farbe-schatten);

    overflow: hidden;
}

/* ÜBERSCHRIFT */

main h3 {
    position: relative;

    margin: 0;
    padding: 27px 32px;

    font-size: 21px;
    font-weight: 750;
    letter-spacing: -0.5px;
    line-height: 1.3;

    border-bottom: 1px solid var(--farbe-rahmen);
}

/* GELBER AKZENT AN DER ÜBERSCHRIFT */

main h3::before {
    content: "";

    position: absolute;
    left: 0;
    top: 26px;
    bottom: 26px;

    width: 4px;

    background: var(--farbe-primaer);
    border-radius: 0 3px 3px 0;
}

/* ==========================================
   EINZELNE FRISTEN
   ========================================== */

main > div > div {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;

    min-height: 100px;
    padding: 22px 32px;

    background: var(--farbe-oberflaeche);

    border-bottom: 1px solid var(--farbe-rahmen);

    transition: background-color 0.2s ease;
}

/* LETZTE FRIST */

main > div > div:last-child {
    border-bottom: none;
}

/* HOVER */

main > div > div:hover {
    background: var(--farbe-tabellenzeile-hover);
}

/* FRISTEN-BESCHRIFTUNG */

main > div > div p {
    flex: 1;

    margin: 0;

    color: var(--farbe-text);

    font-size: 15px;
    font-weight: 650;
    line-height: 1.5;
}

/* ==========================================
   DATUMSEINGABEN
   ========================================== */

main input[type="text"] {
    width: 190px;
    min-height: 45px;
    flex-shrink: 0;

    padding: 11px 15px;

    background: var(--farbe-oberflaeche);
    color: var(--farbe-text);

    border: 1px solid var(--farbe-rahmen);
    border-radius: 9px;

    font-family: inherit;
    font-size: 14px;
    font-weight: 550;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

/* PLACEHOLDER */

main input::placeholder {
    color: var(--farbe-text-sekundaer);
    opacity: 0.8;
}

/* HOVER */

main input:hover {
    border-color: var(--farbe-primaer);
}

/* FOKUS */

main input:focus {
    border-color: var(--farbe-primaer);

    box-shadow:
        0 0 0 3px var(--farbe-primaer-hell);
}

/* ==========================================
   SPEICHERN-BUTTON
   ========================================== */

#speichern {
    align-self: flex-end;

    min-width: 135px;
    min-height: 46px;

    margin-top: 25px;
    padding: 13px 27px;

    background: var(--farbe-primaer);
    color: var(--farbe-text);

    border: 1px solid var(--farbe-primaer);
    border-radius: 9px;

    font-weight: 750;

    box-shadow:
        0 4px 12px var(--farbe-schatten);
}

#speichern:hover {
    background: var(--farbe-primaer-hover);
    border-color: var(--farbe-primaer-hover);
}

/* ==========================================
   TABLET
   ========================================== */

@media (max-width: 800px) {

    header {
        padding: 20px 24px;
    }

    main {
        padding: 40px 24px 70px;
    }

    main h3 {
        padding: 24px;
    }

    main > div > div {
        padding: 20px 24px;
    }

    main input[type="text"] {
        width: 165px;
    }
}

/* ==========================================
   SMARTPHONE
   ========================================== */

@media (max-width: 600px) {

    header {
        min-height: 74px;
        padding: 16px 18px;
    }

    header h2 {
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        font-size: 12px;
    }

    main {
        padding: 32px 18px 60px;
    }

    main > button:first-child {
        margin-bottom: 22px;
    }

    main > div {
        border-radius: 11px;
    }

    main h3 {
        padding: 22px 20px;

        font-size: 19px;
    }

    main h3::before {
        top: 21px;
        bottom: 21px;
    }

    /* FRISTEN UNTEREINANDER */

    main > div > div {
        flex-direction: column;
        align-items: stretch;
        gap: 13px;

        min-height: auto;
        padding: 20px;
    }

    main > div > div p {
        font-size: 14px;
    }

    main input[type="text"] {
        width: 100%;
        min-height: 44px;
    }

    #speichern {
        width: 100%;
        margin-top: 20px;
    }
}

/* ==========================================
   REDUZIERTE ANIMATIONEN
   ========================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

    </style>
</head>
<body>
<header>
    <h2>Fristen | Schuljahr 2026/27</h2>
    <button onclick="logout()">Logout</button>
</header>
<main>
    <button onclick="redirect('../Admin_Ansicht.html')">
        Back
    </button>

    <div>
        <h3>Fristen eintragen</h3>

        <div>
            <p>1. Admin-Daten eintragen bis</p>
            <input type="text" placeholder="01.01.2026">
        </div>

        <div>
            <p>2. Lehrer-Wünsche bis</p>
            <input type="text" placeholder="01.01.2026">
        </div>

        <div>
            <p>3. Fachverantwortliche bis</p>
            <input type="text" placeholder="01.01.2026">
        </div>

        <div>
            <p>4. AV / Direktion bis</p>
            <input type="text" placeholder="01.01.2026">
        </div>
    </div>

    <button id="speichern" onclick="redirect('../Admin_Ansicht.html?from=fristen')">Speichern</button>
</main>
</body>
</html>
