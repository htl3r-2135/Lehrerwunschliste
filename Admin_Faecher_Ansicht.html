<!DOCTYPE html>
<html lang="de">
<head>
    <title>Fach erstellen</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
/* ------------------------------------------
           Gemeinsame Prototyp-Logik (in allen Admin-
           Stammdaten-Seiten gleich).
           Die Daten liegen im localStorage des Browsers.
           ------------------------------------------ */

        const SPEICHER_KEY = "lwl.stammdaten.v1";

        const STANDARD_DATEN = {
            abteilungen: ["WEBT", "Informationstechnologie", "Mechatronik"],
            klassen: [
                { name: "4CN", abteilung: "Informationstechnologie", stufe: 4, schueler: 22 },
                { name: "5CN", abteilung: "Informationstechnologie", stufe: 5, schueler: 21 },
                { name: "5AX", abteilung: "WEBT", stufe: 5, schueler: 23 }
            ],
            faecher: [],
            lehrer: []
        };

        let zwischenspeicher = null;

        function laden() {
            let daten = null;
            try {
                daten = JSON.parse(localStorage.getItem(SPEICHER_KEY));
            } catch (e) {}
            if (!daten) daten = zwischenspeicher;
            if (!daten) daten = JSON.parse(JSON.stringify(STANDARD_DATEN));
            for (const liste of ["abteilungen", "klassen", "faecher", "lehrer"]) {
                if (!Array.isArray(daten[liste])) daten[liste] = [];
            }
            return daten;
        }

        function speichern(daten) {
            zwischenspeicher = daten;
            try {
                localStorage.setItem(SPEICHER_KEY, JSON.stringify(daten));
            } catch (e) {}
        }

        /* Wurde die Seite über Admin_Uebersicht.html geöffnet (?start=neu),
           führt "Zurück" wieder dorthin – sonst zu Admin_Ansicht.html. */

        const VON_NEUER_UEBERSICHT =
            new URLSearchParams(window.location.search).get("start") === "neu";

        const STARTSEITE = VON_NEUER_UEBERSICHT
            ? "Admin_Uebersicht.html"
            : "Admin_Ansicht.html";

        function logout() {
            window.location.href = "./Anmeldung.html";
        }

        /* Geführte Stammdatenerstellung (?gefuehrt=1): nur dann werden
           "Schritt X von 4" und die Zurück/Weiter-Leiste angezeigt. */
        const GEFUEHRT =
            new URLSearchParams(window.location.search).get("gefuehrt") === "1";

        function redirect(file) {
            const parameter = [];
            if (VON_NEUER_UEBERSICHT) parameter.push("start=neu");
            if (GEFUEHRT) parameter.push("gefuehrt=1");
            window.location.href = file + (parameter.length ? "?" + parameter.join("&") : "");
        }

        function zurUebersicht(from) {
            window.location.href = STARTSEITE + (from ? "?from=" + encodeURIComponent(from) : "");
        }

        function el(id) {
            return document.getElementById(id);
        }

        function esc(text) {
            return String(text).replace(/[&<>"']/g, zeichen => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[zeichen]));
        }

        function gleich(a, b) {
            return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
        }

        function meldung(text, fehler) {
            const box = el("meldung");
            box.textContent = text;
            box.className = "sichtbar" + (fehler ? " fehler" : "");
        }

        function loeschButton(index, name) {
            return '<td class="loeschen"><button type="button" data-index="' + index +
                '" aria-label="' + esc(name) + ' löschen">✕</button></td>';
        }

        function leereZeile(spalten, text) {
            return '<tr><td class="leer" colspan="' + spalten + '">' + text + '</td></tr>';
        }
    </script>
    <style>

    .karte {

/* REDUZIERTE ANIMATIONEN */

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

/* GEFÜHRTE STAMMDATENERSTELLUNG */

body:not(.gefuehrt) .nur-gefuehrt {
    display: none !important;
}

<body>
<script>if (GEFUEHRT) document.body.classList.add("gefuehrt");</script>
<header>
    <h2>Fächer | Schuljahr 2026/27</h2>
    <button onclick="logout()">Logout</button>
</header>
<main>
    <button onclick="zurUebersicht()">Zurück zur Übersicht</button>

    <div id="meldung" role="status"></div>

    <div class="karte">
        <h3><span id="formular-titel">Fach erstellen</span> <span class="nur-gefuehrt">Schritt 3 von 4</span></h3>
        <form class="inhalt" id="formular" novalidate>
            <div class="zeile">
                <div class="feld">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="z. B. MEDT" autocomplete="off">
                </div>
                <div class="feld schmal">
                    <label for="art">Art</label>
                    <select id="art">
                        <option>Theorie</option>
                        <option>Labor</option>
                        <option selected>Theorie/Labor</option>
                    </select>
                </div>
            </div>

            <span class="beschriftung" id="label-abteilungen">Abteilungen</span>
            <div class="tags" id="abteilungen" role="group" aria-labelledby="label-abteilungen"></div>

            <span class="beschriftung" id="label-stufen">Schulstufen</span>
            <div class="tags" id="stufen" role="group" aria-labelledby="label-stufen"></div>

            <div class="zeile">
                <div class="feld schmal">
                    <label for="wochenstd">Wochenstd.</label>
                    <input type="number" id="wochenstd" min="1" max="20" placeholder="z. B. 3">
                </div>
                <div class="feld">
                    <label for="teiler">Gruppenteiler (Anz. Schüler/Lehrer) – optional</label>
                    <input type="number" id="teiler" min="1" max="40" placeholder="z. B. 6">
                </div>
            </div>

            <div class="leiste">
                <button type="button" id="abbrechen" hidden>Abbrechen</button>
                <button class="primaer" type="submit" id="speichern">Speichern</button>
            </div>
        </form>
    </div>

    <div class="karte">
        <h3>Angelegte Fächer <span id="anzahl"></span></h3>
        <div class="tabelle">
            <table>
                <thead>
                    <tr>
                        <th>Name</th><th>Art</th><th>Abteilungen</th><th>Schulstufen</th>
                        <th>Wochenstd.</th><th>Gruppenteiler</th><th>Bearbeiten</th><th>Löschen</th>
                    </tr>
                </thead>
                <tbody id="liste"></tbody>
            </table>
        </div>
    </div>

    <div class="leiste verteilt nur-gefuehrt">
        <button onclick="redirect('Admin_Klassen_Ansicht.html')">Zurück</button>
        <button class="primaer" onclick="redirect('Admin_Lehrer_Ansicht.html')">Weiter</button>
    </div>
</main>
<script>
    function tag(gruppe, wert) {
        return '<label><input type="checkbox" name="' + gruppe + '" value="' + esc(wert) + '">' +
            esc(wert) + '</label>';
    }

    function ausgewaehlt(gruppe) {
        return Array.from(document.querySelectorAll('input[name="' + gruppe + '"]:checked'), c => c.value);
    }

    /* Index des Fachs, das gerade bearbeitet wird (null = neues Fach anlegen) */
    let bearbeitenIndex = null;

    function bearbeitenButton(index, name) {
        return '<td class="loeschen"><button type="button" data-bearbeiten="' + index +
            '" aria-label="' + esc(name) + ' bearbeiten">✎</button></td>';
    }

    function anzeigen() {
        const daten = laden();
        el("anzahl").textContent = "(" + daten.faecher.length + ")";
        el("liste").innerHTML = daten.faecher.length
            ? daten.faecher.map((f, i) =>
                "<tr><td>" + esc(f.name) + "</td><td>" + esc(f.art) + "</td><td>" +
                esc(f.abteilungen.join(", ")) + "</td><td>" + f.stufen.join(", ") + "</td><td>" +
                f.wochenstd + "</td><td>" + (f.teiler || "–") + "</td>" +
                bearbeitenButton(i, f.name) + loeschButton(i, f.name) + "</tr>").join("")
            : leereZeile(8, "Noch keine Fächer angelegt");
    }

    function bearbeitenBeenden() {
        bearbeitenIndex = null;
        el("formular").reset();
        el("formular-titel").textContent = "Fach erstellen";
        el("speichern").textContent = "Speichern";
        el("abbrechen").hidden = true;
    }

    function bearbeitenStarten(index) {
        const fach = laden().faecher[index];
        if (!fach) return;
        bearbeitenIndex = index;

        el("name").value = fach.name;
        el("art").value = fach.art;
        document.querySelectorAll('input[name="abteilung"]').forEach(c => {
            c.checked = fach.abteilungen.includes(c.value);
        });
        document.querySelectorAll('input[name="stufe"]').forEach(c => {
            c.checked = fach.stufen.includes(Number(c.value));
        });
        el("wochenstd").value = fach.wochenstd;
        el("teiler").value = fach.teiler || "";

        el("formular-titel").textContent = "Fach „" + fach.name + "“ bearbeiten";
        el("speichern").textContent = "Änderungen speichern";
        el("abbrechen").hidden = false;
        el("formular").scrollIntoView({ behavior: "smooth", block: "center" });
        el("name").focus();
    }

    el("abbrechen").addEventListener("click", () => {
        bearbeitenBeenden();
        meldung("Bearbeiten abgebrochen.");
    });

    const abteilungen = laden().abteilungen;
    el("abteilungen").innerHTML = abteilungen.length
        ? abteilungen.map(a => tag("abteilung", a)).join("")
        : '<p class="hinweis">Noch keine Abteilungen vorhanden – bitte zuerst ' +
          '<a href="javascript:redirect(\'Admin_Abteilungen_Ansicht.html\')">Abteilungen anlegen</a>.</p>';
    el("stufen").innerHTML = [1, 2, 3, 4, 5].map(s => tag("stufe", s)).join("");

    el("formular").addEventListener("submit", e => {
        e.preventDefault();
        const daten = laden();
        const name = el("name").value.trim();
        const gewaehlteAbteilungen = ausgewaehlt("abteilung");
        const stufen = ausgewaehlt("stufe").map(Number);
        const wochenstd = parseInt(el("wochenstd").value, 10);
        const teiler = parseInt(el("teiler").value, 10);

        if (!name) return meldung("Bitte einen Fachnamen eingeben.", true);
        if (!gewaehlteAbteilungen.length) return meldung("Bitte mindestens eine Abteilung auswählen.", true);
        if (!stufen.length) return meldung("Bitte mindestens eine Schulstufe auswählen.", true);
        if (!(wochenstd > 0)) return meldung("Bitte die Wochenstunden angeben.", true);
        if (daten.faecher.some((f, i) => i !== bearbeitenIndex && gleich(f.name, name)))
            return meldung("Das Fach „" + name + "“ gibt es bereits.", true);

        const fach = {
            name: name,
            art: el("art").value,
            abteilungen: gewaehlteAbteilungen,
            stufen: stufen,
            wochenstd: wochenstd,
            teiler: teiler > 0 ? teiler : null
        };

        const warBearbeiten = bearbeitenIndex !== null;
        if (warBearbeiten) daten.faecher[bearbeitenIndex] = fach;
        else daten.faecher.push(fach);
        speichern(daten);

        bearbeitenBeenden();
        el("name").focus();
        meldung("Fach „" + name + "“ " + (warBearbeiten ? "geändert." : "gespeichert."));
        anzeigen();
    });

    el("liste").addEventListener("click", e => {
        const button = e.target.closest("button");
        if (!button) return;

        if (button.dataset.bearbeiten !== undefined) {
            bearbeitenStarten(Number(button.dataset.bearbeiten));
            return;
        }

        const index = Number(button.dataset.index);
        const daten = laden();
        const fach = daten.faecher.splice(index, 1)[0];
        speichern(daten);

        if (bearbeitenIndex === index) bearbeitenBeenden();
        else if (bearbeitenIndex !== null && bearbeitenIndex > index) bearbeitenIndex--;

        meldung("Fach „" + fach.name + "“ gelöscht.");
        anzeigen();
    });

    anzeigen();
</script>
</body>
</html>
