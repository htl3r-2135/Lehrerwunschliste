services:

# --- development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    profiles: [ "dev" ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      # This project has no .env file, so Symfony reads its configuration from
      # here. Override any of them from the shell: APP_ENV=prod ./start.sh
      APP_ENV: "${APP_ENV:-dev}"
      APP_DEBUG: "${APP_DEBUG:-1}"
      # Development value only — generate a real one for anything public-facing.
      APP_SECRET: "${APP_SECRET:-dev-only-not-a-production-secret}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:///%kernel.project_dir%/var/data.db}"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$$}"
      DEFAULT_URI: "${DEFAULT_URI:-http://localhost}"
    volumes:
      - ./backend:/var/www/html
    profiles: [ "dev" ]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configuration/sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-appdb}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: